[package]
name = "gluon"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Mail, calendar, tasks and Claude in one terminal app: kastrup, tock and deck as tabs, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/gluon"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
highlight = { version = "0.1", path = "../highlight", package = "fe2o3-highlight" }
# The mail and calendar tabs are the apps themselves, as libraries, so a
# fix in either lands here too.
kastrup = { path = "../kastrup" }
tock = { path = "../tock" }
# The Claude tab is deck.
deck = { path = "../deck" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
